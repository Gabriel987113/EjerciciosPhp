<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><title>Notas</title></head>
<body>
    <h2>REGISTRAR NOTA</h2>
    <form method="POST" action="procesar.php">
        <label>Código de alumno:</label>
        <input type="text" name="cod_alumno" required>
        <br><br>
        <label>Asignatura:</label>
        <input type="text" name="asignatura" required>
        <br><br>
        <label>Nota (0 a 10):</label>
        <input type="number" name="nota" min="0" max="10" step="0.01" required>
        <br><br>
        <input type="submit" value="Guardar nota">
    </form>
</body>
</html>
